{# Light/dark button in the top bar (replaces the theme's own). Shows the mode you switch TO:
   a moon in light mode, a sun in dark mode. The click is handled by _static/theme-toggle.js. #}
<button class="btn btn-sm nav-link pst-navbar-icon theme-switch-button rln-theme pst-js-only" aria-label="Switch light/dark mode" title="Switch light/dark mode">
  <i class="fa-solid fa-moon rln-theme__icon rln-theme__icon--to-dark" aria-hidden="true"></i>
  <i class="fa-solid fa-sun rln-theme__icon rln-theme__icon--to-light" aria-hidden="true"></i>
</button>
